{% if categoryName %}
  <a href="{% url 'blog:postListView' %}">All</a>
{% else %}
  All
{% endif %} |
{% for category in categoryList %}
  {% if category.name == categoryName %}
    {{ categoryName }}
  {% else %}
    <a href="{% url 'blog:postListCategory' category.name %}">{{ category.name }}</a>
  {% endif %} |
  
{% endfor %}
