{% load static%}

<div class="win-toolbar">
	<div class="subbar">
		<p class="item">File</p>
		<p class="item">Edit</p>
		<p class="item">View</p>
		<p class="item">Favourites</p>
		<p class="item">Tools</p>
		<p class="item">Help</p>
	</div>
	<div class="win-logo"></div>
</div>
<div>
	<div class="toolbar-icons">
		<div class="back-button">placeholder </div>
		<div class="forward-button">placehold </div>
		<div class="folders">fold</div>
	</div>
	<div class="search-bar">
	{% if showSearch %}

		<form method="get" action="{{ formAction }}">
			<label for="news-source" style="padding: 3px;"> {{ labelText|default:"Choose news source" }} </label>
			<select id="news-source" name="source" style="width: 100ch;">
				<option value="">— Select source —</option>
				{% for source in sources %}
				<option value="{{ source.id }}" {% if source.id == active_source %}selected{% endif %}>
					{{ source.name }}
				</option>
				{% endfor %}
			</select>
			<button type="submit">Show</button>
		</form>
	{% endif %}
	</div>
</div>
